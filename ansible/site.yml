---
- name: Harden a headless Debian host
  hosts: all
  become: true
  roles:
    - role: router_preflight
      when: welcome_profile | default("host") == "router"
      tags: [always, router_preflight]
    - role: hostname
      tags: [hostname]
    # Must precede ssh and group_prune: ensures user exists without changing
    # passwords or deleting users.
    - role: accounts
      tags: [accounts, users]
    - role: system_upgrade
      tags: [system_upgrade, upgrade]
    - role: ssh
      tags: [ssh]
    - role: sysctl
      tags: [sysctl]
    - role: nftables
      when: nftables_manage | default(true)
      tags: [nftables]
    - role: packages
      tags: [packages]
    - role: ghostty_terminfo
      tags: [ghostty_terminfo, terminfo]
    - role: ssh_workspace
      when: ssh_workspace_manage | default(true)
      tags: [ssh_workspace, workspace]
    - role: greasewood
      tags: [greasewood, vpn]
    - role: auditd
      tags: [auditd]
    - role: journald
      tags: [journald, logging]
    - role: pwquality
      tags: [pwquality]
    - role: pam
      tags: [pam]
    # Conventionally lock root's password; SSH also forbids root login.
    - role: root_password
      tags: [root_password, accounts]
    - role: group_prune
      when: group_prune_manage | default(true)
      tags: [group_prune]
    - role: networkd
      when: networkd_manage | default(true)
      tags: [networkd]
    - role: resolved
      when: resolved_manage | default(true)
      tags: [resolved]
    - role: coredump
      tags: [coredump]
    - role: mounts
      when: mounts_manage | default(true)
      tags: [mounts]
    - role: unattended_upgrades
      tags: [unattended_upgrades, upgrades]
    - role: timesync
      tags: [timesync]
    - role: fail2ban
      tags: [fail2ban]
    - role: module_blacklist
      when: module_blacklist_manage | default(true)
      tags: [module_blacklist, modules]
    - role: disable_mdns
      when: disable_mdns_manage | default(true)
      tags: [disable_mdns, mdns]
    - role: disable_cups
      when: disable_cups_manage | default(true)
      tags: [disable_cups, cups]
    - role: motd
      tags: [motd]
    # --- Vultr image build (only when image_build=true; IMAGE_BUILD=1 apply.sh) ---
    - role: cloud_init
      when: image_build | default(false)
      tags: [cloud_init, image]
    # Cloud-image cleanup: removes cloud-init's sshd drop-in, strips stale ipv6.
    - role: cloudinit_cleanup
      when: cloudinit_cleanup_manage | default(true)
      tags: [cloudinit_cleanup, cloudinit]
    # image_generalize MUST stay last — it wipes host keys / machine-id /
    # cloud-init state, leaving the box ready to snapshot.
    - role: image_generalize
      when: image_build | default(false)
      tags: [image_generalize, image]
    # The accounts role (above) ensures user exists; the
    # root_password role locks root's shadow password field.
    # Still intentionally NOT ported: deleting users, dotfiles, WireGuard, and
    # NFS mounts.
    #
    # Run a subset with:  ansible-playbook site.yml --tags ssh,sysctl
    # Skip the heavy one-off upgrade with:  ... --skip-tags system_upgrade
