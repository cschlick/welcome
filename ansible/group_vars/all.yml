---
# Defaults for the target(s). Override per-host in host_vars/<name>.yml; keep
# secrets in ansible-vault.

# --- connection (remote fleet) ---
# The hardening allows only user over SSH, so connect as user. Ignored for
# the local run (apply.sh uses -c local). The control machine needs user's
# private key (ssh-agent or ~/.ssh) and passwordless sudo on the targets.
ansible_user: user

# --- ssh role ---
# Add a key here and re-run: the ssh role installs it AND switches password auth
# off automatically. Leave empty and passwords stay on (you can't be locked out).
ssh_authorized_keys: {}
ssh_allow_users: ["user"]   # only this user may log in over SSH (AllowUsers)

# --- accounts role: emergency console password for user ---
# user's emergency console password is NOT set here. Run, once:
#   sudo bash set-emergency-password.sh
# It hashes the password you type and writes ansible/secrets.local.yml
# (gitignored, mode 600), which apply.sh auto-loads. The hash is then enforced
# idempotently on every apply; you never re-type the password. Leave it unset
# and user stays password-less. SSH password auth is off, so the password is
# only usable at the Vultr web console / serial — never over the network.

# --- group_prune role ---
# Strip a user from peripheral/desktop groups it doesn't need on a headless box
# (never touches sudo or the user's primary group). Drop `netdev` only if the
# user need not manage networking — systemd-networkd runs as root here, so user
# doesn't.
group_prune:
  - user: user
    groups: [cdrom, floppy, audio, dip, video, plugdev, users, netdev]

# --- Vultr image build ---
# false = configure THIS live box (default). true = build a generalized,
# cloud-init-ready image: adds the cloud_init + image_generalize roles. Set via
# `IMAGE_BUILD=1 bash apply.sh`, not edited here.
image_build: false
