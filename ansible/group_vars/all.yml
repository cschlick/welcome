---
# Defaults for the target(s). Machine-local overrides can go in local.yml,
# which apply.sh loads automatically and Git ignores.

# --- connection (remote fleet) ---
# The hardening allows only user over SSH, so connect as user. Ignored for
# the local run (apply.sh uses -c local). The control machine needs user's
# private key (ssh-agent or ~/.ssh) and passwordless sudo on the targets.
ansible_user: user

# --- ssh role ---
# Keys and future private deployment values live in encrypted ../vault.yml.
ssh_allow_users: ["user"]   # only this user may log in over SSH (AllowUsers)
ssh_authorized_keys_exclusive: true  # remove keys not present in the vault

# --- accounts role ---
# Passwords are deliberately outside scope: the accounts role never reads or
# changes user's password. Set it securely through the console or `passwd`.
user_nopasswd_sudo_commands: ["ALL"]

# --- group_prune role ---
# Strip the managed account from peripheral/desktop groups it does not need on
# a headless box (never touches sudo or its primary group). systemd-networkd
# runs as root, so the account does not need netdev.
group_prune:
  - user: user
    groups: [cdrom, floppy, audio, dip, video, plugdev, users, netdev]

# --- Vultr image build ---
# false = configure THIS live box (default). true = build a generalized,
# cloud-init-ready image: adds the cloud_init + image_generalize roles. Set via
# `IMAGE_BUILD=1 bash apply.sh`, not edited here.
image_build: false
