---
- name: Ensure the persistent journal directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure bounded persistent logging
  ansible.builtin.template:
    src: 99-hardening.conf.j2
    dest: /etc/systemd/journald.conf.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
