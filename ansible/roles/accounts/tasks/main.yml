---
- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true

- name: Ensure required administrative accounts exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default(omit) }}"
    append: "{{ item.append | default(true) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: "{{ item.create_home | default(true) }}"
    state: present
  loop: "{{ accounts_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Require an SSH key before locking an existing password
  ansible.builtin.assert:
    that:
      - >-
        ([ssh_authorized_keys.get(item.name, [])] | flatten | length) > 0
    fail_msg: >-
      Refusing to lock {{ item.name }}'s existing password before a public key
      is configured in ssh_authorized_keys. Add at least one key for
      {{ item.name }}, or supply user_password_hash in ansible/local.yml.
    quiet: true
  loop: "{{ accounts_present }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.password_hash | default('') | length == 0

- name: Install administrative SSH keys before changing passwords
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ [ssh_authorized_keys.get(item.name, [])] | flatten | join('\n') }}"
    exclusive: "{{ ssh_authorized_keys_exclusive | default(false) }}"
    state: present
  loop: "{{ accounts_present }}"
  loop_control:
    label: "{{ item.name }}"
  when: ([ssh_authorized_keys.get(item.name, [])] | flatten | length) > 0

- name: Replace insecure bootstrap passwords
  ansible.builtin.user:
    name: "{{ item.name }}"
    # No local replacement hash: discard and lock any existing password.
    # A supplied hash remains usable at the console and for passworded sudo.
    password: >-
      {{
        item.password_hash
        if (item.password_hash | default('') | length > 0)
        else '!'
      }}
    update_password: always
  loop: "{{ accounts_present }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Install configured passwordless sudo grants
  ansible.builtin.copy:
    content: >-
      {{ item.name }} ALL=(ALL:ALL) NOPASSWD:
      {{ item.nopasswd_sudo_commands | join(', ') }}
    dest: "/etc/sudoers.d/{{ item.name }}-nopasswd"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ accounts_present }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.nopasswd_sudo_commands | default([]) | length > 0

- name: Remove stale passwordless sudo grants
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}-nopasswd"
    state: absent
  loop: "{{ accounts_present }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.nopasswd_sudo_commands | default([]) | length == 0
