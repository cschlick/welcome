---
- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true

- name: Ensure required administrative accounts exist
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default(omit) }}"
    append: "{{ item.append | default(true) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: "{{ item.create_home | default(true) }}"
    password: "{{ item.password | default(omit) }}"
    update_password: "{{ item.update_password | default('on_create') }}"
    state: present
  loop: "{{ accounts_present }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install configured passwordless sudo grants
  ansible.builtin.copy:
    content: >-
      {{ item.name }} ALL=(ALL:ALL) NOPASSWD:
      {{ item.nopasswd_sudo_commands | join(', ') }}
    dest: "/etc/sudoers.d/{{ item.name }}-nopasswd"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ accounts_present }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.nopasswd_sudo_commands | default([]) | length > 0

- name: Remove stale passwordless sudo grants
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}-nopasswd"
    state: absent
  loop: "{{ accounts_present }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.nopasswd_sudo_commands | default([]) | length == 0
