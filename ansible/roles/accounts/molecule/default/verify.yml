---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Read the passwd and group databases
      ansible.builtin.getent:
        database: "{{ item }}"
      loop: [passwd, group, shadow]

    - name: Assert user was created and is in the sudo group
      ansible.builtin.assert:
        quiet: true
        that:
          - "'user' in ansible_facts.getent_passwd"
          - "'user' in (ansible_facts.getent_group['sudo'][2] | default('')).split(',')"

    - name: Assert the unrelated existing account was preserved
      ansible.builtin.assert:
        quiet: true
        that:
          - "'otheruser' in ansible_facts.getent_passwd"
          - "'otheruser' in ansible_facts.getent_group"

    - name: Stat the unrelated account's home directory
      ansible.builtin.stat:
        path: /home/otheruser
      register: verify_otheruser_home

    - name: Assert the unrelated account's home directory remains
      ansible.builtin.assert:
        quiet: true
        that: verify_otheruser_home.stat.isdir

    - name: Assert the existing password was left untouched
      ansible.builtin.assert:
        quiet: true
        that:
          - "ansible_facts.getent_shadow['user'][0] == '$6$insecure$placeholder'"

    - name: Check the bootstrap user's existing home data
      ansible.builtin.stat:
        path: /home/user/existing-file
      register: verify_existing_file

    - name: Assert existing home data was preserved
      ansible.builtin.assert:
        quiet: true
        that: verify_existing_file.stat.exists

    - name: Read user's sudoers grant
      ansible.builtin.slurp:
        path: /etc/sudoers.d/user-nopasswd
      register: verify_user_sudoers

    - name: Assert password-less user has full passwordless sudo
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            (verify_user_sudoers.content | b64decode | trim)
            == 'user ALL=(ALL:ALL) NOPASSWD: ALL'
