---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Read the passwd and group databases
      ansible.builtin.getent:
        database: "{{ item }}"
      loop: [passwd, group]

    - name: Assert user was created and is in the sudo group
      ansible.builtin.assert:
        quiet: true
        that:
          - "'user' in ansible_facts.getent_passwd"
          - "'user' in (ansible_facts.getent_group['sudo'][2] | default('')).split(',')"

    - name: Assert linuxuser was purged from passwd (and its primary group gone)
      ansible.builtin.assert:
        quiet: true
        that:
          - "'linuxuser' not in ansible_facts.getent_passwd"
          - "'linuxuser' not in ansible_facts.getent_group"

    - name: Stat linuxuser's old home directory
      ansible.builtin.stat:
        path: /home/linuxuser
      register: verify_linuxuser_home

    - name: Assert linuxuser's home directory was removed
      ansible.builtin.assert:
        quiet: true
        that: not verify_linuxuser_home.stat.exists
