---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # Seed an unrelated account so the test proves hardening preserves it.
    - name: Create an unrelated existing account
      ansible.builtin.user:
        name: linuxuser
        create_home: true
        shell: /bin/bash

    - name: Ensure user does not exist yet
      ansible.builtin.user:
        name: user
        state: absent
        remove: true
        force: true
