---
# The playbook owns one predictable administrative account. It never deletes
# pre-existing users or changes password state.
user_nopasswd_sudo_commands: ["ALL"]

accounts_present:
  - name: user
    groups: [sudo]
    shell: /bin/bash
    create_home: true
    nopasswd_sudo_commands: "{{ user_nopasswd_sudo_commands }}"
