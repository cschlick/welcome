---
# The playbook owns one predictable administrative account. It never deletes
# pre-existing users.
user_password_hash: ""

# A password-less account needs passwordless sudo to be useful. When an
# operator supplies a password hash, sudo requires that password by default.
# Override explicitly with a command list (or ["ALL"]) if desired.
user_nopasswd_sudo_commands: >-
  {{
    ['ALL']
    if (user_password_hash | default('') | length == 0)
    else []
  }}

accounts_present:
  - name: user
    groups: [sudo]
    shell: /bin/bash
    create_home: true
    password: >-
      {{
        user_password_hash
        if (user_password_hash | default('') | length > 0)
        else omit
      }}
    update_password: always
    nopasswd_sudo_commands: "{{ user_nopasswd_sudo_commands }}"
