---
# Retried: a transient DNS or network blip here used to fail the whole run.
- name: Resolve the Greasewood branch to a commit
  ansible.builtin.command:
    argv:
      - git
      - ls-remote
      - --exit-code
      - "{{ greasewood_repo_url }}"
      - "refs/heads/{{ greasewood_ref }}"
  register: greasewood_remote
  changed_when: false
  retries: 3
  delay: 10
  until: greasewood_remote.rc == 0

# pipx records the spec each package was installed from. Installing from the
# commit, not the branch name, makes that spec say which commit is installed.
- name: Read the installed Greasewood spec
  ansible.builtin.command:
    argv:
      - pipx
      - list
      - --global
      - --json
  register: greasewood_pipx
  changed_when: false

- name: Work out the wanted Greasewood spec
  ansible.builtin.set_fact:
    greasewood_spec: >-
      git+{{ greasewood_repo_url }}@{{ greasewood_remote.stdout.split()[0] }}
    greasewood_installed_spec: >-
      {{ (greasewood_pipx.stdout | from_json).venvs.greasewood.metadata.main_package.package_or_url
         | default('') }}

# The running daemon keeps the old code until it restarts; this role does not
# restart it, since doing so could cut the connection a remote apply arrived on.
- name: Install Greasewood globally
  ansible.builtin.command:
    argv:
      - pipx
      - install
      - --global
      - --force
      - "{{ greasewood_spec }}"
  when: greasewood_installed_spec != greasewood_spec

# Skipped when the host already has a gw-* link, so a re-run never re-joins a
# mesh this machine is on. To move a host to a different mesh, leave first.
- name: Check whether the host is already on a mesh
  ansible.builtin.set_fact:
    greasewood_joined: >-
      {{ ansible_facts.interfaces | default([]) | select('match', 'gw-')
         | list | length > 0 }}

# no_log keeps the token out of logs/apply-*.log, but it also censors a failure,
# which leaves a failed join undiagnosable. So this never fails directly: it
# records the result and the next task reports it with the token redacted.
- name: Join the Greasewood mesh
  ansible.builtin.command:
    argv:
      - gw
      - join
      - "{{ greasewood_join_token }}"
  register: greasewood_join
  no_log: true
  changed_when: greasewood_join.rc == 0
  failed_when: false
  when:
    - greasewood_join_token | length > 0
    - not greasewood_joined

- name: Report a failed mesh join
  ansible.builtin.fail:
    msg: |-
      `gw join` failed with rc={{ greasewood_join.rc }}.
      stderr: {{ greasewood_join.stderr | default('') | replace(greasewood_join_token, '<redacted>') }}
      stdout: {{ greasewood_join.stdout | default('') | replace(greasewood_join_token, '<redacted>') }}
      The token itself is redacted above. Check that it has not already been
      used or expired, and that this host can reach the mesh coordinator.
  when:
    - greasewood_join is not skipped
    - greasewood_join.rc | default(0) != 0
