---
- name: Check that Microsoft publishes VS Code for this architecture
  ansible.builtin.assert:
    that: ansible_facts.architecture in vscode_architectures
    fail_msg: >-
      VS Code has no apt package for {{ ansible_facts.architecture }}.
      Set vscode_manage=false for this host.
    quiet: true

# The code package's postinst adds its own copy of the Microsoft repository
# unless told not to. Beside the one below, with a different Signed-By path,
# apt then refuses every update with "Conflicting values set for option
# Signed-By". Answer its debconf question before it is asked.
- name: Stop the code package adding its own apt source
  ansible.builtin.debconf:
    name: code
    question: code/add-microsoft-repo
    vtype: boolean
    value: "false"

# deb822_repository needs python3-debian on the target.
- name: Install the apt source module's dependency
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add Microsoft's VS Code apt repository
  ansible.builtin.deb822_repository:
    name: vscode
    types: deb
    uris: "{{ vscode_repo_url }}"
    suites: stable
    components: main
    architectures: "{{ vscode_architectures[ansible_facts.architecture] }}"
    signed_by: "{{ vscode_key_url }}"
  register: vscode_repo

- name: Install VS Code
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: "{{ vscode_repo is changed }}"

# Regenerated from the package's own files on every run, so upstream changes
# to them carry through; only each Exec= line gains the flag.
- name: Read VS Code's packaged launchers
  ansible.builtin.slurp:
    src: "/usr/share/applications/{{ item }}"
  loop: "{{ vscode_desktop_files }}"
  register: vscode_desktop_src
  when: vscode_ozone_platform | length > 0

- name: Create the local applications directory
  ansible.builtin.file:
    path: /usr/local/share/applications
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: vscode_ozone_platform | length > 0

- name: Override the launchers to pass --ozone-platform
  ansible.builtin.copy:
    content: >-
      {{ item.content | b64decode
         | regex_replace('(?m)^(Exec=\S+)', '\1 --ozone-platform=' ~ vscode_ozone_platform) }}
    dest: "/usr/local/share/applications/{{ item.item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ vscode_desktop_src.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: vscode_ozone_platform | length > 0

# Ahead of /usr/bin/code on PATH, so a terminal launch matches the launcher.
- name: Install the code wrapper that passes --ozone-platform
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Managed by welcome (vscode role): see vscode_ozone_platform.
      exec /usr/bin/code --ozone-platform={{ vscode_ozone_platform }} "$@"
    dest: "{{ vscode_wrapper }}"
    owner: root
    group: root
    mode: "0755"
  when: vscode_ozone_platform | length > 0

- name: Remove the --ozone-platform overrides
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ vscode_desktop_files | map('regex_replace', '^', '/usr/local/share/applications/') + [vscode_wrapper] }}"
  when: vscode_ozone_platform | length == 0
