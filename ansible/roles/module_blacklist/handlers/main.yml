---
# Rebuild the initramfs so the blacklist also covers modules pulled in early at
# boot. Reboot to fully apply; already-loaded modules remain until then.
- name: Rebuild initramfs
  ansible.builtin.command: update-initramfs -u
  changed_when: true
  when: module_blacklist_apply

- name: Mark reboot required
  ansible.builtin.copy:
    content: "System restart required to apply module blacklist changes.\n"
    dest: /var/run/reboot-required
    owner: root
    group: root
    mode: "0644"
    force: false
