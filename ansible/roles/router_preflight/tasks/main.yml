---
- name: Read IPv4 forwarding state
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: router_ipv4_forwarding
  changed_when: false
  check_mode: false

- name: Read IPv6 forwarding state
  ansible.builtin.command: sysctl -n net.ipv6.conf.all.forwarding
  register: router_ipv6_forwarding
  changed_when: false
  check_mode: false

- name: Require forwarding on an existing router
  ansible.builtin.assert:
    that:
      - router_ipv4_forwarding.stdout == "1"
    fail_msg: >-
      Router profile refused to continue because IPv4 forwarding is not active.
      Confirm this is the intended router and enable forwarding first.
  when: router_require_ipv4_forwarding

- name: Read the existing nftables ruleset
  ansible.builtin.command: nft list ruleset
  register: router_nftables_ruleset
  changed_when: false
  check_mode: false
  when: router_require_nftables

- name: Require an existing nftables ruleset
  ansible.builtin.assert:
    that:
      - router_nftables_ruleset.stdout | trim | length > 0
    fail_msg: >-
      Router profile refused to continue because no nftables ruleset is loaded.
      Its firewall is deliberately preserved rather than generated by welcome.
  when: router_require_nftables
