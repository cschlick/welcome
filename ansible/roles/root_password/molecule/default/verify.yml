---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Read root's shadow entry
      ansible.builtin.getent:
        database: shadow
        key: root

    - name: Assert root's password field is locked
      ansible.builtin.assert:
        quiet: true
        that:
          # [0] is the password field. A leading ! is the conventional lock.
          - ansible_facts.getent_shadow['root'][0] | default('') is match('^!')
        fail_msg: "root password field is not locked"
