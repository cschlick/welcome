---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # Pre-install packages the role USED to purge. The verify step asserts they
    # survive, so a removal step cannot be reintroduced without failing a test.
    - name: Pre-install packages the role must not remove
      ansible.builtin.apt:
        name:
          - wamerican
          - ufw
        state: present
        update_cache: true
