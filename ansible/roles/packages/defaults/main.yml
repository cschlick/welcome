---
# Packages to ensure installed — the common list from the repo's packages.txt.
packages_install:
  - curl
  - wget
  - git
  - htop
  - jq
  - rsync
  - screen
  - dnsutils
  - tcpdump
  - cracklib-runtime
  - ncurses-term
  - pipx
  - wireguard-tools

# This role INSTALLS ONLY. It never removes or purges a package.
#
# It used to purge a curated list of ~100 packages — the build toolchain, the
# GPU/X/Wayland/GL stack, audio, dictionaries and desktop cruft — on the
# reasoning that a headless server has no use for them. That was removed after
# it was applied to a desktop by mistake and took the graphics and audio stack
# with it. The list could not distinguish "this host does not need a GUI" from
# "this host is a GUI", and getting that wrong is expensive and slow to undo,
# while the benefit was a modest reduction in installed bytes.
#
# Removing packages is now a deliberate, manual act. If you want a minimal
# host, build it minimal — install what you need rather than deleting what you
# do not. `apt autoremove --purge` remains available by hand for orphans.

# Disable apt Recommends/Suggests so installs stay minimal (/etc/apt/apt.conf.d).
packages_no_recommends: true
