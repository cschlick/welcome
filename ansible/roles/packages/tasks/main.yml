---
# Set first, so the install task below already honours it.
- name: Disable apt Recommends and Suggests
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (packages role)
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
    dest: /etc/apt/apt.conf.d/99norecommends
    owner: root
    group: root
    mode: "0644"
  when: packages_no_recommends

- name: Install the base package set
  ansible.builtin.apt:
    name: "{{ packages_install }}"
    state: present
    update_cache: true
  when: packages_install | length > 0

# This role deliberately has no removal step. See defaults/main.yml for why the
# purge list and the autoremove that followed it were taken out.
