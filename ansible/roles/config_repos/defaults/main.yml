---
# Personal tool configuration kept as private Git repositories, each checked out
# AS the tool's config directory — cschlick/claude-config is ~/.claude,
# cschlick/codex-config is ~/.codex, cschlick/devin-config is ~/.config/devin,
# cschlick/vscode-config is ~/.config/Code/User.
# This role checks each out for one account
# and fast-forwards it on every later run. It does NOT install the tools
# themselves; that stays manual.
#
# The repositories are private, so each needs a credential: a GitHub DEPLOY
# KEY scoped to that one repository, held in the encrypted
# ../../vault.yml. GitHub refuses the same key as a deploy key on two
# repositories, so every entry has its own. An entry whose key is empty (the
# default) is skipped, so hosts without it are unaffected.
#
# Adding a key, on the controller (repeat per repository):
#
#   ssh-keygen -t ed25519 -N '' -C welcome-<repo> -f ./deploy
#   # GitHub -> cschlick/<repo> -> Settings -> Deploy keys -> Add deploy key,
#   # paste deploy.pub. Tick "Allow write access" to push config changes from
#   # the machine. NOT under your account's SSH keys: that would grant access
#   # to every repository.
#   { echo '<repo>_deploy_key: |'; sed 's/^/  /' deploy; }  # e.g. claude_config_deploy_key
#   ansible-vault edit ansible/vault.yml   # paste the block printed above
#   #   the | keeps the line breaks
#   shred -u ./deploy ./deploy.pub
#
# The repository this playbook lives in is public: the vault password is the
# only thing protecting these keys. Each is scoped to one repository, so a
# leak exposes that config and nothing else — but a write-enabled key lets the
# holder change it, and these configs (hooks, settings) run on every machine.
# Use a strong vault password.
claude_config_deploy_key: ""
codex_config_deploy_key: ""
devin_config_deploy_key: ""
vscode_config_deploy_key: ""

config_repos_user: user

# Each entry: name (label), repo, branch (fast-forward only), dir and key_file
# (both relative to the account's home), key (the private key's contents), and
# optionally setup: a script in the repository, run as the account from inside
# the checkout after every sync. It must be safe to re-run. Optionally enabled:
# false skips the entry (default true), for config whose tool this host lacks.
config_repos:
  - name: claude-config
    repo: git@github.com:cschlick/claude-config.git
    branch: main
    dir: .claude
    key_file: .ssh/claude_config_deploy_key
    key: "{{ claude_config_deploy_key }}"
  - name: codex-config
    repo: git@github.com:cschlick/codex-config.git
    branch: main
    dir: .codex
    key_file: .ssh/codex_config_deploy_key
    key: "{{ codex_config_deploy_key }}"
  # Its README asks for setup.sh after cloning: it adds the repository's
  # .gitconfig (the cschlick identity, matching git_identity) to the global
  # git config through include.path.
  - name: devin-config
    repo: git@github.com:cschlick/devin-config.git
    branch: master
    dir: .config/devin
    key_file: .ssh/devin_config_deploy_key
    key: "{{ devin_config_deploy_key }}"
    setup: setup.sh
  # Desktops only, where the vscode role installs VS Code (which it does before
  # this role runs). setup.sh installs the extensions listed in extensions.txt.
  - name: vscode-config
    repo: git@github.com:cschlick/vscode-config.git
    branch: main
    dir: .config/Code/User
    key_file: .ssh/vscode_config_deploy_key
    key: "{{ vscode_config_deploy_key }}"
    setup: setup.sh
    enabled: "{{ vscode_manage | default(false) }}"
