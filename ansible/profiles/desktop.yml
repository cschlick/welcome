---
# Desktop profile — for a machine running GNOME (or any desktop environment).
#
# The base host profile assumes nobody is sitting at the console: it blacklists
# the audio, bluetooth and webcam kernel modules, strips the account out of the
# groups that reach its own video and audio devices, migrates networking off
# NetworkManager, and disables printing and mDNS discovery.
#
# This profile keeps every control that is independent of having a display,
# and disables only those that assume an empty console.
#
# It does NOT install GNOME. Install the desktop yourself (`apt install
# gnome-core`, `tasksel`, …) and use this profile to harden around it.
#
#   ./apply.sh -K                                   # on the machine itself
#   WELCOME_PROFILE=desktop ./apply.sh -K
#   ./bootstrap-remote.sh user@HOST --profile desktop
welcome_profile: desktop

# --- roles that assume a headless box -----------------------------------
# Note: package purging is no longer part of this playbook at all — the
# packages role installs and never removes — so this profile no longer has to
# defend the graphics, audio and desktop stack from it.

# Blacklists the audio, bluetooth, webcam and joystick kernel modules. Every
# one of those is a device a desktop user expects to work.
module_blacklist_manage: false

# Strips the account out of cdrom, audio, video, plugdev and netdev — exactly
# the groups that grant a seated user its sound, camera, removable media and
# network-management access.
group_prune_manage: false

# A desktop is managed by NetworkManager. This role migrates the host onto
# systemd-networkd and masks networking.service, which fights NetworkManager
# for ownership of the interfaces.
networkd_manage: false

# The resolved role restarts systemd-networkd and swaps /etc/resolv.conf as
# part of applying. With NetworkManager owning DNS, leave resolution alone.
resolved_manage: false

# Printing. A desktop is the one machine that legitimately prints.
disable_cups_manage: false

# Avahi/mDNS — how GNOME finds network printers, shares and cast targets. The
# role purges the daemon outright, so it has to stay off here.
disable_mdns_manage: false

# Mounts /tmp as a 2G noexec tmpfs and binds /var/tmp onto it. noexec on /tmp
# breaks installers, Flatpak/Steam helpers and anything that stages a script
# there — and a desktop runs arbitrary user software by definition. Re-enable
# with mounts_manage=true once you know the machine's software tolerates it.
mounts_manage: false

# --- firewall -----------------------------------------------------------
# nftables stays on: the input policy is still drop, SSH is still the only
# inbound TCP. mDNS needs an explicit hole because multicast replies come from
# an address the host never sent to, so conntrack never marks them established.
nftables_extra_udp_ports:
  - 5353            # mDNS (Avahi) — printer, share and device discovery
